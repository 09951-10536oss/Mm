<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#082f49">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Science Rift</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06131c;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff}
button{font:inherit}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;background:#06131c;touch-action:none}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;pointer-events:none}
.panel{pointer-events:auto;width:min(92vw,520px);max-height:92vh;overflow:auto;padding:24px;border:1px solid rgba(255,255,255,.2);border-radius:26px;background:rgba(5,18,28,.62);backdrop-filter:blur(14px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.hidden{display:none!important}
h1{font-size:clamp(38px,10vw,72px);margin:0 0 6px;letter-spacing:2px}
h2{margin:0 0 12px}
.sub{opacity:.82;margin:0 0 20px}
.btn{width:100%;margin:7px 0;padding:14px 16px;border:0;border-radius:15px;color:#fff;background:rgba(255,255,255,.12);cursor:pointer;font-weight:700}
.btn.primary{background:linear-gradient(135deg,#13b9d6,#2563eb)}
.btn:active{transform:scale(.98)}
.row{display:flex;gap:10px}.row>*{flex:1}
.stat{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.1)}
#hud{position:fixed;left:0;right:0;top:0;padding:12px 14px;display:none;justify-content:space-between;align-items:flex-start;pointer-events:none}
.hudbox{padding:8px 12px;border-radius:14px;background:rgba(0,0,0,.28);backdrop-filter:blur(8px);font-weight:700}
#jumpBtn{position:fixed;right:18px;bottom:20px;width:98px;height:98px;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.32),rgba(255,255,255,.08));color:white;font-weight:900;display:none;z-index:5;touch-action:none;box-shadow:0 8px 30px rgba(0,0,0,.25),inset 0 0 20px rgba(255,255,255,.08);backdrop-filter:blur(8px)}
#pauseBtn{position:fixed;right:14px;top:62px;display:none;z-index:5;background:rgba(0,0,0,.28);border:0;border-radius:12px;color:white;padding:9px 12px;backdrop-filter:blur(8px)}
#menuBtn{position:fixed;left:14px;top:62px;display:none;z-index:5;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.18);border-radius:12px;color:white;padding:9px 12px;backdrop-filter:blur(8px)}
#toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);padding:11px 16px;border-radius:14px;background:rgba(0,0,0,.7);opacity:0;transition:.2s;pointer-events:none;z-index:10}
#toast.show{opacity:1}
.modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.42);z-index:8}
.question{width:min(92vw,560px);padding:22px;border-radius:24px;background:rgba(7,25,38,.95);border:1px solid rgba(255,255,255,.2)}
.answer{width:100%;text-align:left;padding:13px;margin:6px 0;border:1px solid rgba(255,255,255,.15);border-radius:13px;background:rgba(255,255,255,.08);color:white;cursor:pointer}
.small{font-size:13px;opacity:.75;line-height:1.55}
.range{width:100%}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="menu" class="screen">
  <div class="panel">
    <h1>SCIENCE RIFT</h1>
    <p class="sub">วิ่ง • กระโดด • Double Jump • เก็บเหรียญ • ตอบคำถามวิทยาศาสตร์</p>
    <button class="btn primary" id="startBtn">▶ เริ่มเกม</button>
    <div class="row">
      <button class="btn" id="shopBtn">🛒 ร้านค้า</button>
      <button class="btn" id="statsBtn">📊 สถิติ</button>
    </div>
    <div class="row">
      <button class="btn" id="settingsBtn">⚙️ ตั้งค่า</button>
      <button class="btn" id="howBtn">❓ วิธีเล่น</button>
    </div>
    <div class="stat"><span>🪙 เหรียญ</span><b id="menuCoins">0</b></div>
    <p class="small">เวอร์ชัน 2: Animated Prototype สำหรับงาน PWA — รองรับคอมและมือถือแนวตั้ง</p>
  </div>
</div>

<div id="hud">
  <div class="hudbox">🪙 <span id="coins">0</span></div>
  <div class="hudbox">🌌 ด่าน <span id="stage">1</span>/5</div>
  <div class="hudbox">📏 <span id="distance">0</span> m</div>
</div>
<button id="menuBtn">⌂ MENU</button>
<button id="pauseBtn">Ⅱ</button>
<button id="jumpBtn">JUMP</button>
<div id="toast"></div>

<div id="infoModal" class="modal hidden"><div class="question" id="infoContent"></div></div>
<div id="failOverlay" class="modal hidden"><div class="question">
  <h2>💥 พลาด!</h2><p id="failMessage">ตกจากเส้นทาง</p>
  <button class="btn primary" id="retryBtn">🔄 เริ่มด่านใหม่</button>
  <button class="btn" id="failMenuBtn">⌂ กลับหน้าเมนู</button>
</div></div>
<div id="questionModal" class="modal hidden"><div class="question">
  <div class="small" id="qStage"></div><h2 id="qText"></h2><div id="answers"></div>
</div></div>

<script>
"use strict";
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+"px";canvas.style.height=H+"px";ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener("resize",resize); resize();

const $=id=>document.getElementById(id);
const saveKey="scienceRiftSaveV1";
let save=JSON.parse(localStorage.getItem(saveKey)||"null")||{
 coins:0,best:0,distance:0,falls:0,questions:0,correct:0,portals:0,
 music:.35,sfx:.7,owned:["default"],selected:"default",usedQuestions:[]
};
function persist(){localStorage.setItem(saveKey,JSON.stringify(save)); updateMenu();}
function updateMenu(){$("menuCoins").textContent=save.coins.toLocaleString()}

const stages=[
 {name:"Swamp of Life",emoji:"🌿",bg:"#12a9a4",water:"#159fb4",platform:"#f5dca0",accent:"#7ef7dd",hazard:"water"},
 {name:"Lava Core",emoji:"🔥",bg:"#35151a",water:"#d44a19",platform:"#e7c28a",accent:"#ffb32e",hazard:"lava"},
 {name:"Frozen Crystal",emoji:"❄️",bg:"#193e59",water:"#78d8ef",platform:"#d8f4ff",accent:"#a9f3ff",hazard:"ice"},
 {name:"Energy Factory",emoji:"⚡",bg:"#171b45",water:"#493db7",platform:"#d7d4ec",accent:"#67e8f9",hazard:"energy"},
 {name:"Cosmic Rift",emoji:"🌌",bg:"#100d2d",water:"#291f65",platform:"#d5d0ff",accent:"#d8b4fe",hazard:"space"}
];

const questions=[
 ["น้ำบริสุทธิ์ที่ระดับน้ำทะเลเดือดประมาณกี่องศาเซลเซียส?",["50°C","100°C","150°C","200°C"],1],
 ["พืชใช้แก๊สใดในการสังเคราะห์ด้วยแสง?",["ออกซิเจน","ไนโตรเจน","คาร์บอนไดออกไซด์","ไฮโดรเจน"],2],
 ["แรงใดดึงวัตถุเข้าหาพื้นโลก?",["แรงเสียดทาน","แรงโน้มถ่วง","แรงแม่เหล็ก","แรงลอยตัว"],1],
 ["หน่วยพื้นฐานของสิ่งมีชีวิตคืออะไร?",["อะตอม","เซลล์","โมเลกุล","เนื้อเยื่อ"],1],
 ["ดาวเคราะห์ดวงใดอยู่ใกล้ดวงอาทิตย์ที่สุด?",["โลก","ดาวอังคาร","ดาวพุธ","ดาวพฤหัสบดี"],2],
 ["น้ำแข็งเปลี่ยนเป็นน้ำเรียกการเปลี่ยนสถานะว่าอะไร?",["การระเหย","การหลอมเหลว","การควบแน่น","การระเหิด"],1],
 ["โลหะชนิดใดเป็นของเหลวที่อุณหภูมิห้อง?",["เหล็ก","ทองแดง","ปรอท","อะลูมิเนียม"],2],
 ["เสียงเดินทางผ่านสุญญากาศได้หรือไม่?",["ได้","ไม่ได้","ได้เฉพาะเสียงสูง","ได้เฉพาะเสียงต่ำ"],1],
 ["อวัยวะใดสูบฉีดเลือดไปทั่วร่างกาย?",["ปอด","หัวใจ","ตับ","ไต"],1],
 ["พลังงานจากการเคลื่อนที่เรียกว่าอะไร?",["พลังงานศักย์","พลังงานจลน์","พลังงานเคมี","พลังงานนิวเคลียร์"],1],
 ["กระแสไฟฟ้าไหลได้ดีในวัสดุประเภทใด?",["ฉนวน","ตัวนำ","แก้ว","ยาง"],1],
 ["ชั้นบรรยากาศที่มีโอโซนมากคือชั้นใด?",["โทรโพสเฟียร์","สตราโตสเฟียร์","มีโซสเฟียร์","เอกโซสเฟียร์"],1],
 ["สิ่งใดเป็นดาวฤกษ์?",["โลก","ดวงจันทร์","ดวงอาทิตย์","ดาวเทียม"],2],
 ["H2O คือสูตรเคมีของสารใด?",["ออกซิเจน","เกลือ","น้ำ","คาร์บอนไดออกไซด์"],2],
 ["การเปลี่ยนน้ำเป็นไอเรียกว่าอะไร?",["การแข็งตัว","การระเหย","การหลอมเหลว","การควบแน่น"],1],
 ["อวัยวะใดใช้แลกเปลี่ยนแก๊สในมนุษย์?",["หัวใจ","ปอด","กระเพาะ","สมอง"],1],
 ["แม่เหล็กมีขั้วหลักกี่ขั้ว?",["1","2","3","4"],1],
 ["แสงเดินทางเร็วกว่าเสียงหรือไม่?",["เร็วกว่า","ช้ากว่า","เท่ากัน","ไม่สามารถเปรียบเทียบ"],0],
 ["สิ่งมีชีวิตชนิดใดสร้างอาหารเองได้?",["พืชสีเขียว","เสือ","เห็ด","มนุษย์"],0],
 ["ดาวเคราะห์ดวงใดมีวงแหวนเด่นชัด?",["ดาวเสาร์","โลก","ดาวพุธ","ดาวศุกร์"],0],
 ["กรดทำให้กระดาษลิตมัสสีน้ำเงินเปลี่ยนเป็นสีใด?",["แดง","เขียว","เหลือง","ไม่เปลี่ยน"],0],
 ["อุณหภูมิเป็นการวัดสิ่งใด?",["ความร้อน/ความเย็น","มวล","ระยะทาง","แรง"],0],
 ["หน่วยของแรงในระบบ SI คืออะไร?",["วัตต์","นิวตัน","จูล","ปาสคาล"],1],
 ["พลังงานแสงอาทิตย์จัดเป็นพลังงานแบบใด?",["ทดแทนได้","ใช้แล้วหมดทันที","ฟอสซิล","นิวเคลียร์"],0],
 ["การหมุนรอบตัวเองของโลกทำให้เกิดอะไร?",["ฤดูกาล","กลางวันกลางคืน","น้ำขึ้นน้ำลงทั้งหมด","สุริยุปราคา"],1]
];

function unusedQuestion(){
 let available=questions.map((_,i)=>i).filter(i=>!save.usedQuestions.includes(i));
 if(!available.length){save.usedQuestions=[];available=questions.map((_,i)=>i); persist();}
 return available[Math.floor(Math.random()*available.length)];
}

let audioCtx=null,musicTimer=null;
function audioStart(){
 if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
 if(audioCtx.state==="suspended")audioCtx.resume();
}
function tone(freq,dur,type="sine",vol=.08){
 if(!audioCtx||save.sfx<=0)return;
 const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;
 g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(Math.max(.0001,vol*save.sfx),audioCtx.currentTime+.01);
 g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur+.02);
}
function menuMusic(){
 audioStart(); if(musicTimer||save.music<=0)return;
 const notes=[261.63,329.63,392,329.63,293.66,349.23,440,349.23];let n=0;
 musicTimer=setInterval(()=>{if(state!=="menu"||save.music<=0)return;tone(notes[n++%notes.length],.55,"sine",.035*save.music);},650);
}
function stopMusic(){clearInterval(musicTimer);musicTimer=null}
function sfxCoin(){tone(880,.08,"triangle",.12);setTimeout(()=>tone(1320,.1,"triangle",.08),45)}
function sfxJump(){tone(390,.1,"square",.05);tone(620,.12,"sine",.04)}
function sfxPortal(){tone(180,.4,"sine",.08);setTimeout(()=>tone(420,.45,"sine",.07),120);setTimeout(()=>tone(900,.5,"triangle",.06),260)}
function sfxFail(){tone(90,.45,"sawtooth",.09);setTimeout(()=>tone(55,.35,"sawtooth",.07),100)}
function sfxQuestion(){tone(620,.12,"sine",.08);setTimeout(()=>tone(820,.16,"sine",.06),100)}
function sfxCorrect(){tone(740,.1,"triangle",.1);setTimeout(()=>tone(1100,.2,"triangle",.08),100)}
function sfxAmbient(){
 const st=stages[currentStage];
 if(st.hazard==="water") { if(Math.random()<.22)tone(240,.12,"sine",.025); }
 if(st.hazard==="lava") { if(Math.random()<.2)tone(75,.2,"sawtooth",.025); }
 if(st.hazard==="energy") { if(Math.random()<.12)tone(180+Math.random()*180,.1,"square",.02); }
}

let state="menu",currentStage=0,worldX=0,last=performance.now(),distance=0;
let animTime=0,shake=0,portalPulse=0,waterTime=0;
let cameraBob=0,cameraTilt=0,cameraZoom=1,portalPull=0,portalFinish=0;
let player={x:0,y:0,vy:0,ground:false,jumps:0,immortal:0};
let platforms=[],coins=[],boxes=[],portal=null;
let particles=[],birds=[],frogs=[];
let runStart=0,stageCoins=0,stageDone=false;

function resetStage(){
 worldX=0;distance=0;stageCoins=0;stageDone=false;portalPull=0;portalFinish=0;cameraTilt=0;cameraZoom=1;
 player={x:110,y:H*.5,vy:0,ground:false,jumps:0,immortal:0};
 platforms=[];coins=[];boxes=[];particles=[];birds=[];frogs=[];
 let x=20;
 const count=34+currentStage*3;
 for(let i=0;i<count;i++){
   const gap=38+Math.random()*(38+currentStage*12);
   const len=Math.max(82,125+Math.random()*90-currentStage*6);
   x+=gap;
   const wave=Math.sin(i*.8+currentStage)*Math.min(H*.10,65);
   const y=H*.48+wave+(Math.random()-.5)*Math.min(H*.14,85);
   platforms.push({x,y,w:Math.max(82,len),h:18,depth:14+Math.random()*10,tilt:(Math.random()-.5)*.08});
   if(i%2===0||Math.random()<.7)coins.push({x:x+len*.5,y:y-30,r:8,taken:false});
   if(i>1&&i<count-2&&Math.random()<.12)boxes.push({x:x+len*.72,y:y-34,hit:false});
   x+=len;
 }
 portal={x:x+120,y:H*.48,r:42};
 for(let i=0;i<5;i++)birds.push({x:Math.random()*W,y:80+Math.random()*180,s:25+Math.random()*25});
 for(let i=0;i<4;i++)frogs.push({x:Math.random()*W,y:H*.62+Math.random()*90,t:Math.random()*5});
 $("stage").textContent=currentStage+1;
}
function worldToScreenX(x){return x-worldX}
function jump(){
 if(state!=="playing")return;
 if(player.ground||player.jumps<2){
   player.vy=-610;player.ground=false;player.jumps++;
   sfxJump(); for(let i=0;i<6;i++)burst(player.x,player.y+12,"#fff",1);
 }
}
function startGame(){
 audioStart();menuMusic();stopMusic();state="playing";currentStage=0;save.falls=save.falls;runStart=performance.now();resetStage();
 $("menu").classList.add("hidden");$("hud").style.display="flex";$("jumpBtn").style.display="block";$("pauseBtn").style.display="block";$("menuBtn").style.display="block";$("failOverlay").classList.add("hidden");
} 
function nextStage(){
  // ห้ามเปลี่ยนด่านถ้าไม่ได้อยู่ในขั้นตอน Portal
  if(state!=="portal") return;

  portalPull=0;
  portalFinish=0;

  // ด่าน 5 = จบเกม
  if(currentStage>=4){
    finishGame();
    return;
  }

  // ไปแค่ด่านถัดไป 1 ด่าน
  currentStage++;

  // สร้างด่านใหม่
  resetStage();

  // สำคัญมาก!!
  // ต้องกลับมาเป็น playing ไม่ใช่ portal
  state="playing";

  $("pauseBtn").textContent="Ⅱ";
  $("jumpBtn").style.display="block";
  $("pauseBtn").style.display="block";
  $("menuBtn").style.display="block";

  toast(
    "🌀 ผ่านด่าน! เตรียมตัวเข้าสู่ "+
    stages[currentStage].name
  );

}  
function finishGame(){
 state="menu";save.portals++;save.best=Math.max(save.best,Math.floor(distance)+stageCoins);save.distance+=Math.floor(distance);persist();
 $("hud").style.display="none";$("jumpBtn").style.display="none";$("pauseBtn").style.display="none";$("menuBtn").style.display="none";$("failOverlay").classList.add("hidden");
 $("menu").classList.remove("hidden");updateMenu();toast("🏆 จบครบ 5 ด่าน! +"+stageCoins+" เหรียญ");
 menuMusic();
}
function fail(){
 if(player.immortal>0||state==="failed")return;
 state="failed";save.falls++;persist();sfxFail();
 burst(player.x,player.y,"#fff",22);
 $("failMessage").textContent=stages[currentStage].emoji+" คุณพลาดในด่าน "+(currentStage+1)+" • "+stages[currentStage].name;
 $("failOverlay").classList.remove("hidden");
 $("jumpBtn").style.display="none";$("pauseBtn").style.display="none";
}
function collectCoin(c){
 c.taken=true;
 stageCoins+=10;
 save.coins+=10;
 persist();
 sfxCoin();
 burst(c.x,c.y,stages[currentStage].accent,8);
}
function hitBox(b){
 if(b.hit)return;b.hit=true;sfxQuestion();openQuestion();
}
function openQuestion(){
 state="question";const qi=unusedQuestion();save.usedQuestions.push(qi);save.questions++;persist();
 const q=questions[qi];$("qStage").textContent=stages[currentStage].emoji+" กล่องวิทยาศาสตร์ • คำถามที่ "+save.questions;
 $("qText").textContent=q[0];$("answers").innerHTML="";
 q[1].forEach((a,i)=>{const btn=document.createElement("button");btn.className="answer";btn.textContent=(["A","B","C","D"][i])+"  "+a;btn.onclick=()=>answer(i,q[2]);$("answers").appendChild(btn)});
 $("questionModal").classList.remove("hidden");
}
function answer(i,correct){
 $("questionModal").classList.add("hidden");state="playing";
 if(i===correct){
   save.correct++;
 stageCoins+=200;
 save.coins+=200;
 sfxCorrect();
 toast("✅ ถูกต้อง! +200 เหรียญ");
   if(Math.random()<.04){player.immortal=4;toast("⚡ IMMORTAL 4 วินาที!");}
   persist();
 }else{toast("❌ ยังไม่ถูก ไม่ได้รับโบนัส");}
}
function burst(x,y,color,n){
 for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*180,vy:(Math.random()-.5)*180,life:.5+Math.random()*.5,color});
}
function toast(t){$("toast").textContent=t;$("toast").classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>$("toast").classList.remove("show"),1500)}

function update(dt){
 animTime+=dt; waterTime+=dt; portalPulse+=dt*4;
 shake=Math.max(0,shake-dt*3);
 cameraBob=Math.sin(animTime*7)*1.5;

 if(state==="portal"){
   portalPull=Math.min(1,portalPull+dt*1.8);
   if(portal){
     const dx=portal.x-player.x,dy=portal.y-player.y;
     player.x+=dx*Math.min(1,dt*(2.2+portalPull*4));
     player.y+=dy*Math.min(1,dt*(2.2+portalPull*4));
     player.vy=0;
     for(let i=0;i<5;i++)burst(player.x+(Math.random()-.5)*18,player.y+(Math.random()-.5)*18,stages[currentStage].accent,1);

     }

   for(const p of platforms){
     if(player.x+12>p.x&&player.x-12<p.x+p.w&&player.y+18>=p.y&&player.y+18<=p.y+28&&player.vy>=0){
       player.y=p.y-18;player.vy=0;player.ground=true;player.jumps=0;
     }
   }
   if(player.immortal>0)player.immortal=Math.max(0,player.immortal-dt);
   for(const c of coins)if(!c.taken&&Math.hypot(c.x-player.x,c.y-player.y)<28)collectCoin(c);
   for(const b of boxes)if(!b.hit&&Math.hypot(b.x-player.x,b.y-player.y)<30)hitBox(b);
   if(portal&&Math.hypot(portal.x-player.x,portal.y-player.y)<portal.r+18){
     state="portal";portalPull=.05;portalFinish=0;shake=.8;sfxPortal();
   }
   if(player.y>H+80){
     shake=1;
     const st=stages[currentStage];
     burst(player.x,Math.min(H-20,player.y),st.hazard==="lava"?"#ff9d38":"#b7f7ff",18);
     fail();
   }
 }

 for(const p of particles){
   if(state==="portal"&&portal){
     const dx=portal.x-p.x,dy=portal.y-p.y,d=Math.max(1,Math.hypot(dx,dy));

 }
 particles=particles.filter(p=>p.life>0);

 })();
 cameraTilt+=(targetTilt-cameraTilt)*Math.min(1,dt*3.5);
 const targetZoom=state==="portal"?1.12:1;
 cameraZoom+=(targetZoom-cameraZoom)*Math.min(1,dt*3);

 $("coins").textContent=save.coins.toLocaleString();$("distance").textContent=Math.floor(distance);

function drawPortal(x,y,r){

 if(type==="settings")html=`<h2>⚙️ ตั้งค่า</h2><p>🎵 เพลงเมนู: <input class="range" id="musicRange" type="range" min="0" max="1" step=".05" value="${save.music}"></p><p>🔊 เสียงเอฟเฟกต์: <input class="range" id="sfxRange" type="range" min="0" max="1" step=".05" value="${save.sfx}"></p><button class="btn" onclick="saveSettings()">บันทึก</button><button class="btn" onclick="resetData()">รีเซ็ตข้อมูลเกม</button><button class="btn primary" onclick="closeInfo()">กลับ</button>`;
 if(type==="shop")html=`<h2>🛒 ร้านค้าตัวละคร</h2><p>เหรียญของคุณ: <b>${save.coins.toLocaleString()}</b></p><div id="shopList"></div><button class="btn primary" onclick="closeInfo()">กลับ</button>`;
 if(type==="about")html=`<h2>ℹ️ เกี่ยวกับเกม</h2><p><b>Science Rift</b> เป็นเกมวิทยาศาสตร์ HTML5 + Canvas + PWA ที่สร้างขึ้นสำหรับโปรเจกต์การเรียนรู้</p><p>เวอร์ชันนี้เป็น Prototype: มี 5 ธีมด่าน, Double Jump, เหรียญ, คำถาม, ประตูมิติ, สถิติ และบันทึกข้อมูล Offline</p><button class="btn primary" onclick="closeInfo()">กลับ</button>`;
 $("infoContent").innerHTML=html;$("infoModal").classList.remove("hidden");
 if(type==="shop")renderShop();
}
function renderShop(){
 const chars=[["default","Explorer","ฟรี"],["robot","Robo","3000"],["scientist","Scientist","3000"],["energy","Energy","3000"],["rift","Rift Walker","3000"]];
 const box=$("shopList");box.innerHTML="";
 chars.forEach(c=>{const d=document.createElement("div");d.className="stat";let owned=save.owned.includes(c[0]);d.innerHTML=`<span>🧑 ${c[1]}<br><small>${c[2]} เหรียญ</small></span><button class="btn" style="width:auto;margin:0">${owned?(save.selected===c[0]?"✓ ใช้อยู่":"ใช้"):("ซื้อ "+c[2])}</button>`;d.querySelector("button").onclick=()=>{if(owned){save.selected=c[0];persist();renderShop()}else if(save.coins>=3000){save.coins-=3000;save.owned.push(c[0]);save.selected=c[0];persist();renderShop()}else toast("เหรียญไม่พอ");};box.appendChild(d)})
}
function saveSettings(){save.music=+$("musicRange").value;save.sfx=+$("sfxRange").value;persist();closeInfo();if(state==="menu")menuMusic()}
function resetData(){if(confirm("รีเซ็ตเหรียญ สถิติ และตัวละครที่ซื้อทั้งหมด?")){localStorage.removeItem(saveKey);location.reload()}}
function closeInfo(){$("infoModal").classList.add("hidden");if(state==="info")state="menu"}

$("startBtn").onclick=startGame;
$("shopBtn").onclick=()=>openInfo("shop");
$("statsBtn").onclick=()=>openInfo("stats");
$("settingsBtn").onclick=()=>openInfo("settings");
$("howBtn").onclick=()=>openInfo("how");
$("infoModal").addEventListener("click",e=>{if(e.target.id==="infoModal")closeInfo()});
$("jumpBtn").addEventListener("pointerdown",e=>{e.preventDefault();jump()});
$("pauseBtn").onclick=()=>{if(state==="playing"){state="paused";$("pauseBtn").textContent="▶"}else if(state==="paused"){state="playing";$("pauseBtn").textContent="Ⅱ"}};
function retryStage(){
 $("failOverlay").classList.add("hidden");state="playing";$("jumpBtn").style.display="block";$("pauseBtn").style.display="block";$("menuBtn").style.display="block";resetStage();
}
function goMenu(){
 save.best=Math.max(save.best,Math.floor(distance)+stageCoins);
 save.distance+=Math.floor(distance);persist();
 state="menu";$("failOverlay").classList.add("hidden");$("hud").style.display="none";$("jumpBtn").style.display="none";$("pauseBtn").style.display="none";$("menuBtn").style.display="none";$("menu").classList.remove("hidden");$("pauseBtn").textContent="Ⅱ";menuMusic();
}
$("retryBtn").onclick=retryStage;$("failMenuBtn").onclick=goMenu;$("menuBtn").onclick=goMenu;
addEventListener("keydown",e=>{if(e.code==="Space"){e.preventDefault();if(state==="menu")startGame();else jump()}});
canvas.addEventListener("pointerdown",e=>{if(state==="playing")jump()});

function loop(t){const dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}
updateMenu();menuMusic();requestAnimationFrame(loop);
</script>
<script>
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
</script>
</body>
</html>
